version: "3.9"

services:

  backend:
    build:
      context: ./backend
    container_name: booking_backend
    command: daphne -b 0.0.0.0 -p 8080 booking_project.asgi:application
    volumes:
      - ./backend:/app
      - media_volume:/app/booking_project/media
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis


  postgres:
    image: postgres:16
    container_name: booking_postgres
    restart: always
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


  redis:
    image: redis:7
    container_name: booking_redis
    ports:
      - "6379:6379"


  celery:
    build:
      context: ./backend
    container_name: booking_celery
    command: celery -A booking_project worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres


  celery_beat:
    build:
      context: ./backend
    container_name: booking_celery_beat
    command: celery -A booking_project beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres


  frontend:
    build:
      context: ./react_test5
    container_name: booking_frontend
    depends_on:
      - backend


  nginx:
    image: nginx:latest
    container_name: booking_nginx
    ports:
      - "80:80"
    volumes:
      - ./Infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - media_volume:/app/media
    depends_on:
      - frontend
      - backend


volumes:
  postgres_data:
  media_volume:






