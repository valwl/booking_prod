version: "3.9"



services:

  backend:

    build: ./backend

    command: >

      daphne -b 0.0.0.0 -p 8080 booking_project.booking_project.asgi:application

    volumes:

      - ./backend:/app

    env_file:

      - ./backend/booking_project/.env

    depends_on:

      - redis

    ports:

      - "8080:8080"



  celery_worker:

    build: ./backend

    command: celery -A booking_project.booking_project.celery worker -l info

    volumes:

      - ./backend:/app

    env_file:

      - ./backend/booking_project/.env

    depends_on:

      - redis



  celery_beat:

    build: ./backend

    command: celery -A booking_project.booking_project beat -l info

    volumes:

      - ./backend:/app

    env_file:

      - ./backend/booking_project/.env

    depends_on:

      - redis



  redis:

    image: redis:7

    ports:

      - "6379:6379"



