version: '3.8'

services:
  # Postgres DB
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  # Redis for channels + celery broker
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend

  # Backend (Django + Daphne)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app  # dev: bind mount for live code reload. In prod remove.
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    networks:
      - backend

  # Celery worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app worker -l info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    networks:
      - backend

  # Celery beat (optional scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app beat -l info --pidfile=
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    networks:
      - backend

  # Frontend (React) — dev server or static serve
  frontend:
    build:
      context: ./frontend
      # assumes frontend/Dockerfile exists which builds production bundle
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"    # optional dev-server
    depends_on:
      - backend
    networks:
      - frontend_net

  # Nginx reverse proxy (serves frontend static files in prod + proxies API and websockets)
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # In prod you might copy built frontend into nginx image or mount build folder
      - static_volume:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  backend:
  frontend_net: