version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      -"5672:5672"
      -"15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    nginx:
      image: nginx
      container_name: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      depends_on:
        - User_service
        - apartments_service
        - Booking_service
        - payment_service
        - review_service

      apartments:
        build:
          context: ./apartments_service
          ports:
            - "8002:8002"

      bookings:
        build:
          context: ./Booking_service
          ports:
            - "8003:8003"

      payments:
        build:
          context: ./payment_service
          ports:
            - "8004:8004"

      reviews:
        build:
          context: ./review_service
          ports:
            - "8005:8005"%