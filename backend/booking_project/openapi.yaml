components:
  schemas:
    Apartment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        weekend_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        images:
          type: array
          items:
            $ref: '#/components/schemas/ApartmentImg'
          readOnly: true
        user:
          type: integer
        location:
          type: integer
      required:
      - base_price
      - description
      - id
      - images
      - location
      - title
      - user
      - weekend_price
    ApartmentCreateSerializers:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        weekend_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        location:
          type: integer
        images:
          type: array
          items:
            type: string
          writeOnly: true
      required:
      - base_price
      - description
      - images
      - location
      - title
      - weekend_price
    ApartmentImg:
      type: object
      properties:
        img:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
      required:
      - id
      - img
    ApartmentUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        weekend_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        images:
          type: string
          readOnly: true
        removed_images:
          type: array
          items:
            type: integer
          writeOnly: true
      required:
      - base_price
      - description
      - images
      - title
      - weekend_price
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        checkin_day:
          type: string
          format: date-time
        checkout_day:
          type: string
          format: date-time
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        paid:
          type: boolean
        status:
          $ref: '#/components/schemas/StatusEnum'
        create:
          type: string
          format: date-time
          readOnly: true
        apartment:
          type: integer
        user:
          type: integer
      required:
      - apartment
      - checkin_day
      - checkout_day
      - create
      - id
      - total_price
      - user
    CustomUserRegister:
      type: object
      properties:
        phone_number:
          type: string
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
      required:
      - first_name
      - last_name
      - password
    CustomUserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        phone_number:
          type: string
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
      required:
      - first_name
      - last_name
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/LocationsImgSerializers'
          readOnly: true
      required:
      - description
      - id
      - images
      - name
    LocationsImgSerializers:
      type: object
      properties:
        img:
          type: string
          format: uri
          nullable: true
    MyTokenObtainPair:
      type: object
      properties:
        login:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - login
      - password
    PatchedApartmentUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        weekend_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        images:
          type: string
          readOnly: true
        removed_images:
          type: array
          items:
            type: integer
          writeOnly: true
    PatchedBooking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        checkin_day:
          type: string
          format: date-time
        checkout_day:
          type: string
          format: date-time
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        paid:
          type: boolean
        status:
          $ref: '#/components/schemas/StatusEnum'
        create:
          type: string
          format: date-time
          readOnly: true
        apartment:
          type: integer
        user:
          type: integer
    PatchedCustomUserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        phone_number:
          type: string
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
    ReviewSerializers:
      type: object
      properties:
        apartment:
          type: integer
        rating:
          type: integer
