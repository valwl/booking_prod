server {
    listen 80;
    server_name _;

    # Static files (frontend build) - optional
    root /usr/share/nginx/html;
    index index.html;

    # Serve API at /api/ -> proxied to backend (Daphne)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # allow larger uploads
        client_max_body_size 50M;
    }

    # WebSocket /channels/ (Django Channels)
    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy to Daphne (ASGI). In docker-compose backend:daphne listens on 8000
        proxy_pass http://backend:8000;
        proxy_read_timeout 86400;
    }

    # Fallback: serve frontend SPA (for client-side routing)
    location / {
        try_files $uri /index.html;
    }

    # Optional: health check endpoint proxy to backend health endpoint
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
        }
    }